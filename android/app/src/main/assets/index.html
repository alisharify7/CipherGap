<body><main>
<header><img src="extension/assets/ciphergap.svg" width="44" height="44" alt=""><div><strong>CipherGap</strong><small data-en="Your conversations. Your keys." data-fa="گفتگوهای شما، کلیدهای شما."></small></div><button id="guideButton" class="icon-button" aria-label="Guide">?</button></header>
<nav aria-label="Sections"><button data-page="home" data-en="Messengers" data-fa="پیام‌رسان‌ها"></button><button data-page="settings" data-en="Settings" data-fa="تنظیمات"></button><button data-page="guide" data-en="Guide" data-fa="راهنما"></button></nav>
<section id="home" class="page"><div class="hero"><span class="eyebrow" data-en="CIPHERGAP FOR ANDROID" data-fa="CIPHERGAP برای اندروید"></span><h1 data-en="A familiar chat. An extra layer of privacy." data-fa="همان گفتگوی آشنا، با یک لایهٔ حریم خصوصی."></h1><p data-en="Choose a messenger, sign in to its web version, and keep encryption close at hand." data-fa="پیام‌رسان را انتخاب کنید، وارد نسخهٔ وب آن شوید و ابزار رمزنگاری را کنار دستتان داشته باشید."></p></div>
<p id="compatibility" class="warning" hidden data-en="Update Android System WebView to use CipherGap. Encryption requires an isolated execution environment." data-fa="Android System WebView را به‌روزرسانی کنید. رمزنگاری به محیط اجرای جدا نیاز دارد."></p>
<div class="messengers"><button data-messenger="bale"><img src="messengers/bale.png" alt=""><span><strong data-en="Bale" data-fa="بله"></strong><small data-en="Open web messenger" data-fa="باز کردن نسخهٔ وب"></small></span><span aria-hidden="true">↗</span></button><button data-messenger="eitaa"><img src="messengers/eitaa.svg" alt=""><span><strong data-en="Eitaa" data-fa="ایتا"></strong><small data-en="Open web messenger" data-fa="باز کردن نسخهٔ وب"></small></span><span aria-hidden="true">↗</span></button><button data-messenger="telegram"><img src="messengers/telegram.svg" alt=""><span><strong data-en="Telegram" data-fa="تلگرام"></strong><small data-en="Telegram Web A" data-fa="تلگرام وب A"></small></span><span aria-hidden="true">↗</span></button><button disabled><img src="messengers/rubika.png" alt=""><span><strong data-en="Rubika" data-fa="روبیکا"></strong><small data-en="In development" data-fa="در دست توسعه"></small></span></button><button disabled><img src="messengers/whatsapp.svg" alt=""><span><strong data-en="WhatsApp" data-fa="واتساپ"></strong><small data-en="In development" data-fa="در دست توسعه"></small></span></button></div>
<button id="resume" class="primary" hidden data-en="Return to your open messenger" data-fa="بازگشت به پیام‌رسان بازشده"></button>
<aside><strong data-en="A browser, with encryption built in." data-fa="یک مرورگر، با ابزار رمزنگاری همراه."></strong><p data-en="Sign-in happens directly with your messenger. CipherGap has no chat server and sends no chats or keys to its developer." data-fa="ورود مستقیماً در پیام‌رسان انجام می‌شود. CipherGap سرور چت ندارد و چت یا کلید شما را برای توسعه‌دهنده ارسال نمی‌کند."></p><button class="text-button" data-page="guide" data-en="How it works →" data-fa="روش کار ←"></button></aside></section>
<section id="settings" class="page" hidden><h1 data-en="Make it yours" data-fa="مطابق سلیقهٔ شما"></h1><p data-en="These preferences stay on this device." data-fa="این تنظیمات روی همین دستگاه ذخیره می‌شوند."></p>
<div class="card"><label><span data-en="Language" data-fa="زبان"></span><select id="language"><option value="en">English</option><option value="fa">فارسی</option></select></label><label><span data-en="Appearance" data-fa="ظاهر"></span><select id="theme"><option value="light" data-en="Light" data-fa="روشن"></option><option value="dark" data-en="Dark" data-fa="تیره"></option></select></label><label><span data-en="Enable CipherGap" data-fa="فعال بودن CipherGap"></span><input type="checkbox" id="enabled" role="switch"></label><label><span data-en="Notifications" data-fa="اعلان‌ها"></span><input type="checkbox" id="notifications" role="switch"></label><p class="hint" data-en="Generic notifications while the messenger page is running and this app is open. No message text appears in notifications. Delivery after closing the app is not supported in this version." data-fa="اعلان بدون متن پیام، هنگام اجرای صفحه و باز بودن برنامه. در این نسخه دریافت اعلان پس از بسته شدن برنامه پشتیبانی نمی‌شود."></p><button id="securitySettings" class="secondary" data-en="Settings for the current conversation" data-fa="تنظیمات گفتگوی فعلی"></button></div>
<div class="card"><h2 data-en="Browser data" data-fa="داده‌های مرورگر"></h2><p data-en="Sign out of all messengers and remove saved CipherGap keys and settings." data-fa="خروج از همهٔ پیام‌رسان‌ها و حذف کلیدها و تنظیمات ذخیره‌شدهٔ CipherGap."></p><button id="clear" class="danger" data-en="Clear browser data…" data-fa="پاک کردن داده‌های مرورگر…"></button></div></section>
<section id="guide" class="page" hidden><span class="eyebrow" data-en="A QUICK START" data-fa="شروع کار"></span><h1 data-en="From installation to your first encrypted message" data-fa="از نصب تا اولین پیام رمزنگاری‌شده"></h1>
<article class="card"><h2 data-en="1. Install and open" data-fa="۱. نصب و اجرا"></h2><p data-en="Download the test APK from the project's Android release. Android may ask you to allow installation from the browser or Files app you used. Allow it for this installation, then turn it off again. This is an early test build, not a store release." data-fa="APK آزمایشی را از انتشار اندروید پروژه دریافت کنید. اندروید ممکن است اجازهٔ نصب از مرورگر یا برنامهٔ فایل را بخواهد؛ برای همین نصب اجازه دهید و سپس آن را غیرفعال کنید. این نسخه آزمایشی است و انتشار فروشگاهی نیست."></p><p data-en="Android 8 or newer and a current, compatible Android System WebView are required. If encryption is unavailable, update WebView and restart CipherGap." data-fa="اندروید ۸ یا جدیدتر و Android System WebView به‌روز و سازگار لازم است. اگر رمزنگاری در دسترس نبود، WebView را به‌روزرسانی و CipherGap را دوباره اجرا کنید."></p></article>
<article class="card"><h2 data-en="2. Sign in to a messenger" data-fa="۲. ورود به پیام‌رسان"></h2><p data-en="Choose Bale, Eitaa or Telegram. Its own website opens inside this browser. Enter your login information only on that messenger's page. CipherGap does not modify the native messenger apps installed on your phone." data-fa="بله، ایتا یا تلگرام را انتخاب کنید. سایت خود پیام‌رسان داخل این مرورگر باز می‌شود. اطلاعات ورود را فقط در صفحهٔ همان پیام‌رسان وارد کنید. CipherGap اپ‌های اصلی نصب‌شده روی گوشی را تغییر نمی‌دهد."></p></article>
<article class="card"><h2 data-en="3. Agree on a chat key" data-fa="۳. توافق روی کلید گفتگو"></h2><p data-en="Your partner needs CipherGap too, on Android or the desktop extension. Open a conversation and Chat security. Send a key exchange request. Your partner accepts it in the chat; both of you compare the six-digit verification code through a channel you trust, then mark it verified. Requests expire after 15 minutes." data-fa="طرف مقابل هم باید CipherGap اندروید یا افزونهٔ دسکتاپ را داشته باشد. گفتگو و امنیت گفتگو را باز کنید و درخواست تبادل کلید بفرستید. طرف مقابل آن را داخل چت می‌پذیرد؛ کد شش‌رقمی را از راهی مورد اعتماد با هم مقایسه و تأیید کنید. درخواست پس از ۱۵ دقیقه منقضی می‌شود."></p><p data-en="A changed fingerprint may mean a new device or a different partner. Verify it again before sharing sensitive information. Never send your chat key as a normal message." data-fa="تغییر اثر انگشت ممکن است به‌خاطر دستگاه جدید یا طرف مقابل متفاوت باشد. قبل از ارسال اطلاعات حساس دوباره بررسی کنید. کلید گفتگو را به صورت پیام عادی نفرستید."></p></article>
<article class="card"><h2 data-en="4. Send text, files and stickers" data-fa="۴. ارسال متن، فایل و استیکر"></h2><p data-en="Use the CipherGap send control for encrypted text. Choose Encrypted file for attachments, or the CipherGap emoji/sticker picker. Ordinary messenger send controls remain ordinary. Tap an encrypted message or attachment to decrypt it locally. Images, video and audio can be previewed; Download lets you choose where to save the original." data-fa="برای متن رمزنگاری‌شده از کنترل ارسال CipherGap استفاده کنید. برای فایل، ارسال فایل رمزنگاری‌شده و برای استیکر، انتخابگر CipherGap را بزنید. دکمه‌های عادی پیام‌رسان ارسال عادی انجام می‌دهند. پیام یا فایل رمزنگاری‌شده را بزنید تا روی دستگاه رمزگشایی شود. عکس، ویدیو و صدا پیش‌نمایش دارند؛ دانلود محل ذخیرهٔ فایل اصلی را از شما می‌پرسد."></p></article>
<article class="card"><h2 data-en="5. Control your preferences" data-fa="۵. کنترل تنظیمات"></h2><p data-en="App settings control language, appearance, notifications and the global switch. Chat security provides per-chat pause, automatic decryption and key removal. Pausing restores ciphertext and closes decrypted previews. Clearing browser data signs you out and deletes local keys; messages already sent in the messenger remain there." data-fa="تنظیمات برنامه زبان، ظاهر، اعلان و کلید فعال‌سازی کلی را کنترل می‌کند. امنیت گفتگو توقف هر چت، رمزگشایی خودکار و حذف کلید را دارد. توقف، متن رمز‌شده را برمی‌گرداند و پیش‌نمایش‌ها را می‌بندد. پاک کردن داده‌های مرورگر شما را خارج و کلیدهای محلی را حذف می‌کند؛ پیام‌های قبلی داخل پیام‌رسان باقی می‌مانند."></p></article>
<article class="card"><h2 data-en="What privacy means here" data-fa="حریم خصوصی در این برنامه"></h2><p data-en="CipherGap processes messages on your device to encrypt, decrypt and display them. It has no developer-operated chat service, analytics or remote key storage. Login sessions remain in the browser, and saved keys are protected in private app storage using Android Keystore; app backup is disabled." data-fa="CipherGap برای رمزنگاری، رمزگشایی و نمایش، پیام‌ها را روی دستگاه پردازش می‌کند. سرویس چت متعلق به توسعه‌دهنده، تحلیل رفتار یا ذخیرهٔ کلید روی سرور ندارد. نشست ورود در مرورگر می‌ماند؛ کلیدهای ذخیره‌شده در فضای خصوصی برنامه با Android Keystore محافظت می‌شوند و پشتیبان‌گیری برنامه غیرفعال است."></p><p data-en="Your messenger still receives login information, ciphertext and normal account metadata. Decrypted content displayed inside its page can be read by that page's code. This is an additional encryption tool, not a promise that the messenger or a compromised phone cannot see displayed plaintext." data-fa="پیام‌رسان همچنان اطلاعات ورود، متن رمز‌شده و فرادادهٔ معمول حساب را دریافت می‌کند. محتوای رمزگشایی‌شده‌ای که داخل صفحهٔ آن نمایش داده می‌شود برای کد همان صفحه قابل مشاهده است. این ابزار یک لایهٔ رمزنگاری اضافه است؛ تضمین نمی‌کند پیام‌رسان یا گوشی آلوده نتواند متن نمایش‌داده‌شده را ببیند."></p></article>
<article class="card"><h2 data-en="Open source. Open to inspection." data-fa="متن‌باز و قابل بررسی."></h2><p data-en="The Android app and browser extensions live in the same public repository. You can inspect the source, build the app yourself and report issues. No second encryption implementation is maintained for Android." data-fa="برنامهٔ اندروید و افزونه‌ها در یک مخزن عمومی قرار دارند. می‌توانید سورس را بررسی کنید، برنامه را خودتان بسازید و مشکل گزارش کنید. اندروید پیاده‌سازی جداگانه‌ای از رمزنگاری ندارد."></p><div class="links"><button data-link="source" class="secondary" data-en="View Android source" data-fa="مشاهدهٔ سورس اندروید"></button><button data-link="website" class="secondary" data-en="Website & desktop setup" data-fa="سایت و نصب دسکتاپ"></button><button data-link="releases" class="secondary" data-en="Downloads" data-fa="دریافت نسخه‌ها"></button></div></article>
</section><p id="status" role="status" hidden></p><footer><span id="version"></span><span>Ali Sharify · AGPL-3.0</span></footer></main></body></html>

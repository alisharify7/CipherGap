name: Publish CipherGap website
on:
  push:
    branches: [website]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/website _site/CipherGap/assets
          cp index.html .nojekyll _site/
          cp website/style.css website/app.js website/languages.js _site/website/
          cp -R website/fonts website/screenshots website/downloads _site/website/
          cp CipherGap/assets/ciphergap.svg _site/CipherGap/assets/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
